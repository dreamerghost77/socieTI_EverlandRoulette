<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="에버랜드 놀이기구와 미션을 룰렛으로 뽑아 보세요.">
    <title>에버랜드 룰렛</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-screen">
      <section class="home-screen" id="home-screen" aria-label="룰렛 종류 선택">
        <button class="home-button ride-button" type="button" data-kind="ride">놀이기구 뽑기</button>
        <button class="home-button mission-button" type="button" data-kind="mission">미션 뽑기</button>
      </section>

      <section class="roulette-screen" id="roulette-screen" aria-label="룰렛" hidden>
        <p class="roulette-heading" id="roulette-heading"></p>
        <div class="roulette-stage">
          <span class="pointer" aria-hidden="true"></span>
          <div class="roulette-wheel" id="roulette-wheel" role="img" aria-label="돌아가는 룰렛"></div>
          <span class="wheel-hub" aria-hidden="true"><span>GO</span><i>✦</i></span>
        </div>
        <p class="spin-hint" id="spin-hint" role="status" aria-live="polite">돌아가는 중...</p>

        <section class="winner-overlay" id="winner-overlay" aria-labelledby="winner-title" aria-live="polite" hidden>
          <span class="winner-spark winner-spark-left" aria-hidden="true">✦</span>
          <span class="winner-spark winner-spark-right" aria-hidden="true">✧</span>
          <p class="winner-kicker" id="winner-kicker">축하해요!</p>
          <h1 class="winner-title" id="winner-title"></h1>
          <p class="winner-detail" id="winner-detail"></p>
          <div class="winner-actions">
            <button class="winner-button primary-action" id="spin-again" type="button">한 번 더 뽑기</button>
            <button class="winner-button secondary-action" id="back-home" type="button">다른 룰렛 선택</button>
          </div>
        </section>
      </section>
      <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>
    </main>
  </body>
</html>
